name: Micro Skill Request
description: Create a micro-skill request that triggers the micro-skill creation workflow
labels:
  - micro-skill-request
title: "[CC-XXX] Create micro skill: <skill name>"
body:
  - type: input
    id: ticket_key
    attributes:
      label: Ticket Key
      description: "Example: CC-48"
      placeholder: CC-48
    validations:
      required: true

  - type: dropdown
    id: issue_type
    attributes:
      label: Issue Type
      description: Select the type of work for this issue
      options:
        - feature
        - fix
        - chore
        - refactor
        - docs
        - test
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Description
      description: Describe the requested feature or change clearly
      placeholder: Describe the requested feature/change clearly
    validations:
      required: true

  - type: input
    id: skill_name
    attributes:
      label: Skill Name
      description: Name to create via POST /micro-skills
      placeholder: daily-journal
    validations:
      required: true

  - type: input
    id: project_id
    attributes:
      label: Project ID
      description: Project/focus id for the skill
      placeholder: p-08d7818f-9557-4401-be9f-6e0a6e71f07a
    validations:
      required: true

  - type: input
    id: user_id
    attributes:
      label: User ID
      description: User id for skill ownership
      placeholder: "1"
      value: "1"
    validations:
      required: true

name: Create Micro Skill From Issue

on:
  issues:
    types: [opened]

permissions:
  contents: read

jobs:
  create-micro-skill:
    name: Create micro skill
    runs-on: ubuntu-latest
    if: contains(github.event.issue.labels.*.name, 'micro-skill-request')
    steps:
      - name: Parse issue form values
        id: parse
        uses: actions/github-script@v7
        with:
          script: |
            const body = context.payload.issue.body || '';

            const getField = (fieldLabel) => {
              const escaped = fieldLabel.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
              const regex = new RegExp(`### ${escaped}\\n\\n([\\s\\S]*?)(?:\\n\\n### |$)`);
              const match = body.match(regex);
              return match ? match[1].trim() : '';
            };

            const name = getField('Skill Name');
            const projectId = getField('Project ID');
            const description = getField('Description');
            const userId = getField('User ID') || '1';

            if (!name || !projectId || !description || !userId) {
              core.setFailed('Missing one or more required fields from issue form (Skill Name, Project ID, Description, User ID).');
              return;
            }

            core.setOutput('name', name);
            core.setOutput('project_id', projectId);
            core.setOutput('description', description);
            core.setOutput('user_id', userId);

      - name: Create micro skill
        env:
          API_BASE_URL: ${{ vars.NEXT_PUBLIC_API_BASE_URL }}
          SKILL_NAME: ${{ steps.parse.outputs.name }}
          PROJECT_ID: ${{ steps.parse.outputs.project_id }}
          SKILL_DESCRIPTION: ${{ steps.parse.outputs.description }}
          USER_ID: ${{ steps.parse.outputs.user_id }}
        run: |
          if [ -z "$API_BASE_URL" ]; then
            echo "NEXT_PUBLIC_API_BASE_URL repository variable is not set."
            exit 1
          fi

          curl --fail --show-error --silent \
            -X POST "${API_BASE_URL%/}/micro-skills" \
            -H "Content-Type: application/json" \
            -d "$(jq -nc \
              --arg name "$SKILL_NAME" \
              --arg description "$SKILL_DESCRIPTION" \
              --arg project_id "$PROJECT_ID" \
              --arg user_id "$USER_ID" \
              '{name: $name, description: $description, project_id: $project_id, user_id: $user_id}')"

name: Create Micro Skill From Issue

on:
  issues:
    types: [opened]

permissions:
  contents: read

jobs:
  create-micro-skill:
    name: Create micro skill
    runs-on: ubuntu-latest
    if: contains(github.event.issue.labels.*.name, 'micro-skill-request')
    steps:
      - name: Parse issue form values
        id: parse
        uses: actions/github-script@v7
        with:
          script: |
            const body = context.payload.issue.body || '';

            const extractByHeading = (heading) => {
              const escaped = heading.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
              const regex = new RegExp(`### ${escaped}\\n\\n([\\s\\S]*?)(?:\\n\\n### |$)`);
              const match = body.match(regex);
              return match?.[1]?.trim() || '';
            };

            const getField = (...headings) => headings.map(extractByHeading).find(Boolean) || '';

            const name = getField('Skill Name', 'skill_name');
            const projectId = getField('Project ID', 'project_id');
            const description = getField('Description', 'description');

            if (!name || !projectId || !description) {
              core.setFailed('Missing one or more required fields from issue form (Skill Name, Project ID, Description).');
              return;
            }

            core.setOutput('name', name);
            core.setOutput('project_id', projectId);
            core.setOutput('description', description);

      - name: Create micro skill
        env:
          API_BASE_URL: ${{ vars.NEXT_PUBLIC_API_BASE_URL }}
          AUTH_TOKEN: ${{ secrets.MICRO_SKILLS_API_TOKEN }}
          SKILL_NAME: ${{ steps.parse.outputs.name }}
          PROJECT_ID: ${{ steps.parse.outputs.project_id }}
          SKILL_DESCRIPTION: ${{ steps.parse.outputs.description }}
        run: |
          if [ -z "$API_BASE_URL" ]; then
            echo "NEXT_PUBLIC_API_BASE_URL repository variable is not set."
            exit 1
          fi

          CURL_ARGS=(
            --fail
            --show-error
            -X POST
            "${API_BASE_URL%/}/micro-skills"
            -H "Content-Type: application/json"
            -d "$(jq -nc \
              --arg name "$SKILL_NAME" \
              --arg description "$SKILL_DESCRIPTION" \
              --arg project_id "$PROJECT_ID" \
              '{name: $name, description: $description, project_id: $project_id}')"
          )

          if [ -n "$AUTH_TOKEN" ]; then
            CURL_ARGS+=(-H "Authorization: Bearer $AUTH_TOKEN")
          fi

          curl "${CURL_ARGS[@]}"

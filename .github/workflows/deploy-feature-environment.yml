name: Deploy Feature Environment

on:
  pull_request:
    types: [opened, reopened, synchronize, edited]

permissions:
  contents: read

jobs:
  deploy-feature:
    name: Deploy feature environment
    runs-on: ubuntu-latest
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Extract ticket code
        id: ticket
        shell: bash
        run: |
          # Normalize to lowercase so both CC-123 and cc-123 are supported.
          TITLE="$(echo "${{ github.event.pull_request.title }}" | tr '[:upper:]' '[:lower:]')"
          BRANCH="$(echo "${{ github.head_ref }}" | tr '[:upper:]' '[:lower:]')"
          TICKET_CODE="$(printf '%s\n%s\n' "$TITLE" "$BRANCH" | grep -Eo 'cc-[0-9]+' | head -n1 || true)"

          if [ -z "$TICKET_CODE" ]; then
            echo "Could not determine ticket code."
            echo "Use PR title or branch name with format CC-123."
            exit 1
          fi

          echo "ticket_code=$TICKET_CODE" >> "$GITHUB_OUTPUT"
          echo "environment=feat-$TICKET_CODE" >> "$GITHUB_OUTPUT"

      - name: Deploy feature environment
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
        run: |
          # deploy.sh runs npm ci and npm run export before syncing to S3.
          ./deploy.sh "${{ steps.ticket.outputs.environment }}"
